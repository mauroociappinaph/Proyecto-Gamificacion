version: '3.8'

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/app
    environment:
      NODE_ENV: development

  # globalping-mcp-server:
  #   image: globalping/mcp-server:latest
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - GLOBALPING_API_KEY=your_api_key # Replace with your GlobalPing API key
  #   networks:
  #     - default

networks:
  default:
    driver: bridge