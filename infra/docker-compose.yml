services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ..
      dockerfile: ./apps/backend/Dockerfile
    container_name: backend
    ports:
      - "3001:3001"
    environment:
      MONGO_URI: mongodb://mongodb:27017/gravitad_db
      PORT: 3001
    env_file:
      - ../apps/backend/.env
    depends_on:
      - mongodb
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
