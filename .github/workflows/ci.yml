name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript type check
        run: pnpm --filter backend exec tsc --noEmit && pnpm --filter frontend exec tsc --noEmit

      - name: Run linter
        run: pnpm lint

      - name: Run backend tests
        run: pnpm --filter backend test

      - name: Build projects
        run: pnpm --filter frontend --filter backend build
