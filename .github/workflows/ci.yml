name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript type check
        run: pnpm --filter backend exec tsc --noEmit && pnpm --filter frontend exec tsc --noEmit

      - name: Run linter
        run: pnpm lint

      - name: Check code format with Prettier
        run: pnpm prettier --check .

      - name: Run backend tests
        run: pnpm --filter backend test

      - name: Build projects
        run: pnpm --filter frontend --filter backend build

  telegram-notification:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Send Telegram notification on failure
        if: failure() # Solo se ejecuta si el job anterior (build-and-test) falló
        uses: appleboy/telegram-action@non-existent-branch # ERROR INTENCIONAL
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Send Telegram notification on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ CI/CD Exitoso ✅
            Repositorio: ${{ github.repository }}
            Rama: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Estado: Exitoso

      - name: Send Telegram notification on Pull Request
        if: github.event_name == 'pull_request'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📢 Nueva Pull Request 📢
            Repositorio: ${{ github.repository }}
            Título: ${{ github.event.pull_request.title }}
            Rama origen: ${{ github.event.pull_request.head.ref }}
            Rama destino: ${{ github.event.pull_request.base.ref }}
            Autor: ${{ github.event.pull_request.user.login }}
            URL: ${{ github.event.pull_request.html_url }}
